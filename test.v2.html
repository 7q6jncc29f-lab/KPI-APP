<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KPI TEST v2 — Loading</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f3f6fb;color:#15243a;padding:24px}#status{max-width:400px;margin:40px auto;text-align:center}#status strong{display:block;margin-bottom:12px}#status p{line-height:1.5}</style>
</head><body><div id="status"><strong>Loading KPI TEST v2…</strong><p>Fixing partial-week productivity calculations without changing the live app.</p></div>
<script>
(async function loadTestApp(){
  try{
    // This test loads the existing live app source from the same GitHub Pages
    // folder, then patches its calculation IN MEMORY. index.html is never edited.
    const response=await fetch('./index.html?testV2='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load the live source ('+response.status+').');
    let html=await response.text();
    const beginMarker='function recalc(){';
    const endMarker='\nconst allInputs=()=>';
    const begin=html.indexOf(beginMarker);
    const end=html.indexOf(endMarker,begin);
    if(begin===-1||end===-1||html.indexOf(beginMarker,begin+1)!==-1){
      throw new Error('The live app calculation has changed. This test needs a refreshed patch; nothing has been modified.');
    }

    const correctedCode=String.raw`
// KPI TEST v2: Calculate productivity only from day-matched units and hours.
// Weekly unit/hour totals and variances remain unchanged.  A missing actual
// entry may use the corresponding planned figure (the existing projection),
// but it may never borrow units from a day with no hours.
function calculateMatchedProductivity(entries){
  let plannedUnits=0, plannedHours=0, actualUnits=0, actualHours=0;
  for(const e of entries){
    if(e.hasPU&&e.hasPH&&e.ph>0){
      plannedUnits+=e.pu;
      plannedHours+=e.ph;
    }
    const hasEffectiveUnits=e.hasAU||e.hasPU;
    const hasEffectiveHours=e.hasAH||e.hasPH;
    const effectiveHours=e.hasAH?e.ah:e.ph;
    if(hasEffectiveUnits&&hasEffectiveHours&&effectiveHours>0){
      actualUnits+=e.hasAU?e.au:e.pu;
      actualHours+=effectiveHours;
    }
  }
  return {plannedUnits,plannedHours,actualUnits,actualHours};
}
// Round KPI figures consistently at .05 boundaries. Raw calculations stay exact;
// this only prevents binary floating-point noise from changing a displayed tenth.
function fmtKpiTenth(value){
  const multiplier=10;
  const magnitude=Math.abs(value);
  const tolerance=Number.EPSILON*Math.max(1,magnitude*multiplier)*8;
  const rounded=Math.round(magnitude*multiplier+tolerance)/multiplier;
  const display=value<0?-rounded:rounded;
  return display.toLocaleString('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function recalc(){
  let PU=0,PH=0,liveU=0,liveH=0,enteredU=0,enteredH=0;
  const dayEntries=[];
  [...rows.rows].forEach(tr=>{
    const puEl=tr.querySelector('.pu'),auEl=tr.querySelector('.au'),
          phEl=tr.querySelector('.ph'),ahEl=tr.querySelector('.ah');
    formatUnitField(puEl);
    formatUnitField(auEl);
    formatHourField(phEl);
    formatHourField(ahEl);
    const pr=getVal(puEl).trim(),ar=getVal(auEl).trim(),
          phr=getVal(phEl).trim(),hr=getVal(ahEl).trim();
    const pu=num(pr),au=num(ar),ph=hourNum(phEl),ah=hourNum(ahEl);
    const hasPU=pr!=='',hasAU=ar!=='',hasPH=phr!=='',hasAH=hr!=='';
    dayEntries.push({pu,au,ph,ah,hasPU,hasAU,hasPH,hasAH});
    PU+=pu; PH+=ph;
    liveU+=hasAU?au:pu;
    liveH+=hasAH?ah:ph;
    if(hasAU)enteredU++;
    if(hasAH)enteredH++;
    const pp=hasPU&&hasPH&&ph>0?pu/ph:null;
    const ap=hasAU&&hasAH&&ah>0?au/ah:null;
    tr.querySelector('.pp').textContent=pp!==null?fmtKpiTenth(pp):'';
    tr.querySelector('.ap').textContent=ap!==null?fmtKpiTenth(ap):'';
  });

  planUnitsTotal.textContent=PU?fmt(PU):'';
  planHoursTotal.textContent=PH?fmt(PH,2):'';
  const ud=liveU-PU,hd=liveH-PH;
  unitDelta.textContent=enteredU?(ud>=0?'+':'')+fmt(ud):'';
  unitDelta.className='delta '+(enteredU?(ud>=0?'good':'bad'):'');
  hourDelta.textContent=enteredH?(hd>=0?'+':'')+fmt(hd,2):'';
  hourDelta.className='delta '+(enteredH?(hd<=0?'good':'bad'):'');

  const matched=calculateMatchedProductivity(dayEntries);
  const wp=matched.plannedHours>0?matched.plannedUnits/matched.plannedHours:null;
  const wa=(enteredU||enteredH)&&matched.actualHours>0?matched.actualUnits/matched.actualHours:null;
  planProd.textContent=wp!==null?fmtKpiTenth(wp):'';
  actualProd.textContent=wa!==null?fmtKpiTenth(wa):'';
  actualProd.style.color=wa===null||wp===null?'':wa>wp?'var(--green)':wa<wp?'var(--red)':'';

  const t=num(getVal(target));
  const hs=t>0&&matched.plannedHours>0
    ?matched.plannedHours-matched.plannedUnits/t:null;
  hoursSave.textContent=hs===null?'':(hs>0?'+':'')+fmtKpiTenth(hs);
  hoursSave.style.color=hs===null?'':hs<=0?'var(--green)':'var(--red)';
  formatPercentKpiField(cir);
  formatPercentKpiField(wo);
  widgetData={planProd:wp,actualProd:wa,unitsDiff:enteredU?ud:null,hoursDiff:enteredH?hd:null,hoursSave:hs};
  if(typeof refreshDailyDiffs==='function')refreshDailyDiffs();
}`;

    html=html.slice(0,begin)+correctedCode+html.slice(end);
    html=html.replace(/"kpiWidgetProdSettings"/g,'"kpiWidgetProdSettings_TESTV2"');
    html=html.replace(/<title>[^<]*<\/title>/,'<title>KPI TEST v2 — Productivity Fix</title>');
    html=html.replace('</style>',`\n#kpiTestBadge{position:fixed;top:2px;left:50%;transform:translateX(-50%);z-index:2147483645;background:#b91c1c;color:white;font:800 10px -apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:.6px;border-radius:0 0 7px 7px;padding:4px 9px;pointer-events:none}\n</style>`);
    html=html.replace('<body>','<body><div id="kpiTestBadge">TEST v2 • PROD FIX</div>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').innerHTML='<strong>Test could not start</strong><p>'+String(error.message||error).replace(/[<>&]/g,'')+'</p><p>The live KPI app has not been changed.</p>';
    console.error('KPI test v2:',error);
  }
})();
</script></body></html>
