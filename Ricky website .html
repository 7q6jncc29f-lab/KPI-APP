<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KPI"><title>KPI</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;padding:14px}main{max-width:1050px;margin:auto;background:#fff;border:1px solid #aeb7c0}.title{background:#075a98;color:#fff;text-align:center;font-size:28px;font-weight:800;padding:8px}.top{display:grid;grid-template-columns:1fr 1.5fr 1fr 1.5fr}.label{font-weight:700;padding:9px;background:#fff}.yellow{background:#fff0a8}.top input,.kpi input{width:calc(100% - 12px);margin:6px;border:2px solid #b9c3cc;border-radius:8px;background:#fff8cf;text-align:center;font-size:17px;padding:8px;min-height:38px}.group{display:grid;grid-template-columns:1.1fr 2fr 2fr 2fr;background:#dceef8;font-weight:800;text-align:center}.group>div{padding:8px}.sub{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1fr 1fr 1fr;background:#dceef8;text-align:center;font-weight:700;font-size:13px;padding-bottom:6px}.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1fr 1fr 1fr;border-bottom:1px solid #d5d9dd;min-height:46px}.row>div{display:flex;align-items:center;justify-content:center}.row input{width:calc(100% - 10px);height:36px;margin:5px;border:2px solid #b9c3cc;border-radius:7px;text-align:center;font-size:16px;padding:6px;background:#fff0a8}.row .calc{background:#f8f8f8}.row>div{border-right:1px solid #d5d9dd}.row>div:last-child{border-right:0}.total{background:#dceef8;font-weight:800}.total input{background:transparent;font-weight:800}.good{color:#138a36}.bad{color:#d72b2b}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;padding-top:12px}.kpi{border:1px solid #bbb}.kpi h3{margin:0;background:#075a98;color:#fff;text-align:center;padding:7px;font-size:15px}.kpi .value{background:#fff0a8;min-height:54px;display:flex;align-items:center}.spacer{height:8px;background:#fff}.publish{display:block;width:calc(100% - 28px);margin:28px 14px 14px;border:0;border-radius:14px;background:#087bd3;color:white;font-size:22px;font-weight:800;padding:18px}.note{text-align:center;color:#6b7280;font-size:13px;margin:0 0 14px}@media(max-width:700px){body{padding:0}main{min-width:850px}.wrap{overflow-x:auto}.title{position:sticky;left:0}.publish{position:sticky;left:14px;width:calc(100vw - 28px)}}
</style></head><body><div class="wrap"><main id="sheet"><div class="title">KPIs</div><div class="top"><div class="label">Store No:</div><div class="yellow"><input id="store" value="1022" inputmode="numeric"></div><div class="label">Week No:</div><div class="yellow"><input id="week" value="38" inputmode="numeric"></div></div>
<div class="group"><div>Weekly Prod<br>Overview</div><div>Units</div><div>Total Hours</div><div>Net Prod</div></div><div class="sub"><div></div><div>Manager Adjust</div><div>Actual</div><div>Manager Adjust</div><div>Actual</div><div>Plan</div><div>Actual</div></div><div id="days"></div>
<div class="bottom">
<div><div class="kpi"><h3>CIR</h3><div class="value"><input id="cir" value="-0.85%"></div></div><div class="spacer"></div><div class="kpi"><h3>Write Offs WTD</h3><div class="value"><input id="writeoffs"></div></div></div>
<div><div class="kpi"><h3>Prod MTD</h3><div class="value"><input id="mtd" value="234" inputmode="decimal"></div></div><div class="spacer"></div><div class="kpi"><h3>Prod YTD</h3><div class="value"><input id="ytd" value="-2" inputmode="decimal"></div></div></div>
<div><div class="kpi"><h3>Target Prod</h3><div class="value"><input id="target" value="234" inputmode="decimal"></div></div><div class="spacer"></div><div class="kpi"><h3>Hours to Save</h3><div class="value"><input id="save" readonly></div></div></div>
</div></main><button class="publish" id="publish">Publish</button><p class="note">Saved automatically on this iPhone.</p></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const seed=[['24121','27708','108','110','222.8','252.6'],['22322','24716','107','118','209.6','208.7'],['23412','23899','115','123','204.0','193.9'],['23622','24369','97','114','242.9','213.9'],['30879','','107','','288.6',''],['32766','','99','','330.1',''],['19014','','81','','236.2','']];
let state;try{state=JSON.parse(localStorage.getItem('kpi-web-v1'))}catch(e){};if(!state)state={rows:seed};
const days=document.getElementById('days');
function n(v){return Number(String(v||'').replace(',','.'))||0}function fmt(v,d=0){return v?Number(v).toFixed(d):''}
function save(){state.rows=[...document.querySelectorAll('.day')].map(r=>[...r.querySelectorAll('input')].map(x=>x.value));state.store=store.value;state.week=week.value;state.cir=cir.value;state.writeoffs=writeoffs.value;state.mtd=mtd.value;state.ytd=ytd.value;state.target=target.value;localStorage.setItem('kpi-web-v1',JSON.stringify(state))}
function render(){days.innerHTML='';names.forEach((name,i)=>{let a=(state.rows&&state.rows[i])||seed[i];let r=document.createElement('div');r.className='row day';r.innerHTML=`<div>${name}</div><div><input aria-label="${name} manager adjust units" inputmode="numeric" value="${a[0]||''}"></div><div><input aria-label="${name} actual units" inputmode="numeric" value="${a[1]||''}"></div><div><input aria-label="${name} manager adjust hours" inputmode="decimal" value="${a[2]||''}"></div><div><input aria-label="${name} actual hours" inputmode="decimal" value="${a[3]||''}"></div><div><input aria-label="${name} plan prod" inputmode="decimal" value="${a[4]||''}"></div><div><input aria-label="${name} actual prod" inputmode="decimal" value="${a[5]||''}"></div>`;days.appendChild(r)});let t=document.createElement('div');t.className='row total';t.innerHTML='<div>Weekly Total</div><div id="pu"></div><div id="ud"></div><div id="ph"></div><div id="hd"></div><div id="pp"></div><div id="ap"></div>';days.appendChild(t);calc()}
function calc(){let rows=[...document.querySelectorAll('.day')],pu=0,au=0,ph=0,ah=0,plans=[],acts=[];rows.forEach(r=>{let x=[...r.querySelectorAll('input')].map(z=>z.value);pu+=n(x[0]);au+=n(x[1]);ph+=n(x[2]);ah+=n(x[3]);if(n(x[4]))plans.push(n(x[4]));if(n(x[5]))acts.push(n(x[5]))});document.getElementById('pu').textContent=pu.toLocaleString();let ud=au-pu;let ude=document.getElementById('ud');ude.textContent=(ud>0?'+':'')+ud.toLocaleString();ude.className=ud>=0?'good':'bad';document.getElementById('ph').textContent=ph.toFixed(2);let hd=ah-ph,hde=document.getElementById('hd');hde.textContent=(hd>0?'+':'')+hd.toFixed(2);hde.className=hd>0?'bad':'good';document.getElementById('pp').textContent=plans.length?(plans.reduce((a,b)=>a+b,0)/plans.length).toFixed(1):'';document.getElementById('ap').textContent=acts.length?(acts.reduce((a,b)=>a+b,0)/acts.length).toFixed(1):'';let tar=n(target.value);let basisUnits=au||pu;let basisHours=ah||ph;let hs=tar?basisHours-(basisUnits/tar):0;saveEl.value=hs.toFixed(1);saveEl.className=hs<=0?'good':'bad';save()}
const store=document.getElementById('store'),week=document.getElementById('week'),cir=document.getElementById('cir'),writeoffs=document.getElementById('writeoffs'),mtd=document.getElementById('mtd'),ytd=document.getElementById('ytd'),target=document.getElementById('target'),saveEl=document.getElementById('save');['store','week','cir','writeoffs','mtd','ytd','target'].forEach(id=>{let e=document.getElementById(id);if(state[id]!=null)e.value=state[id]});document.addEventListener('input',calc);render();
document.getElementById('publish').onclick=async()=>{calc();const el=document.getElementById('sheet');try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0});canvas.toBlob(async blob=>{const file=new File([blob],`KPI-${store.value}-week-${week.value}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'KPI'})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}},'image/png')}catch(e){alert('Could not create the image. Please check your internet connection and try again.') }};
</script></body></html>
