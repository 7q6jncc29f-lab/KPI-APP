<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Store</title>
<style>
:root{--blue:#075b9d;--pale:#dcebf7;--yellow:#fff0a3;--green:#16822b;--red:#b51f32;--ink:#111}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f4f4f4;color:var(--ink)}
.page{max-width:1080px;margin:18px auto;padding:0 12px}
.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px}
button{border:0;border-radius:9px;padding:11px 17px;font-size:16px;font-weight:700;background:#e4e4e7;color:#111}
button.primary{background:var(--blue);color:#fff}
#undo,#redo{transition:all .16s ease}
#undo.compact{padding-left:9px;padding-right:9px;min-width:54px}
#redo[hidden]{display:none}
#store.invalid{box-shadow:inset 0 0 0 3px var(--red);border-radius:4px}
#capture{background:white;border:1px solid #999;overflow:hidden}
.title{background:var(--blue);color:#fff;text-align:center;font-size:26px;font-weight:800;padding:8px}
.meta{display:grid;grid-template-columns:150px 1fr 140px 1fr;background:var(--pale);font-weight:700;align-items:center}
.meta>div{padding:8px 5px}.entry{background:var(--yellow)!important}
input{width:100%;border:0;background:transparent;text-align:center;font:inherit;font-weight:600;outline:none;padding:3px}
table{width:100%;border-collapse:collapse;table-layout:fixed} th,td{text-align:center;padding:8px 4px}
thead th{background:var(--pale)} thead tr:first-child th{font-size:14px;padding-bottom:3px} thead tr:last-child th{font-size:13px;padding-top:3px}
.day{font-weight:500;text-align:right;padding-right:18px} tbody tr.total td{background:var(--pale);font-weight:800}.total .day{text-align:left}
.actual-input{background:var(--yellow)} .delta.good{color:var(--green)} .delta.bad{color:var(--red)}
.kpis{display:grid;grid-template-columns:1fr 72px 1fr 72px 1fr}.kpi{display:grid;grid-template-rows:31px 44px 31px 44px}
.kpi h3{margin:0;background:var(--blue);color:#fff;text-align:center;font-size:14px;padding:7px}
.kpi .value{background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:700}.spacer{background:#fff}
.note{text-align:center;font-size:12px;color:#666;margin-top:8px}
@media(max-width:700px){.page{margin:8px auto;padding:0 4px}.toolbar{position:sticky;top:0;z-index:5;background:#f4f4f4;padding:5px 0}#capture{min-width:760px;transform-origin:top left}.viewport{overflow-x:auto}.meta{grid-template-columns:110px 1fr 100px 1fr}}
body.pad-open{padding-bottom:390px}
#fastpad{display:none;position:fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none;left:0;right:0;bottom:0;z-index:2147483647;background:#e9ecf1;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));box-shadow:0 -4px 18px #0003}
#fastpad.show{display:block}.padnav{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-bottom:8px}
.padgrid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;gap:8px}.padgrid>button{width:100%!important;grid-column:auto!important}
.padbottom{display:grid!important;grid-template-columns:2fr .75fr .75fr 1fr!important;gap:8px;margin-top:8px}.padbottom>button{width:100%!important;grid-column:auto!important}
#fastpad button{min-height:58px;touch-action:manipulation;-webkit-user-select:none;user-select:none;border-radius:13px;background:#fff;font-size:27px;font-weight:800;box-shadow:0 1px 3px #0002}
#fastpad .nav{min-height:44px;font-size:15px}#fastpad .done{background:var(--blue);color:#fff}#fastpad .op{font-size:30px}#fastpad .zero{grid-column:auto!important}#fastpad .enter{font-size:38px;line-height:1}
input.pad-active{box-shadow:inset 0 0 0 3px #1687e8;border-radius:4px}
</style></head><body>
<div class="page"><div class="toolbar"><button id="undo" disabled>Undo</button><button id="redo" hidden disabled>Redo</button><button id="reset">Reset Form</button><button id="publish" class="primary">Publish</button></div>
<div class="viewport"><section id="capture"><div class="title">KPIs</div><div class="meta"><div>Store No:</div><div class="entry"><input id="store" value=""></div><div>Week No:</div><div class="entry"><input id="week" value=""></div></div>
<table><thead><tr><th rowspan="2">Weekly Prod<br>Overview</th><th colspan="2">Units</th><th colspan="2">Total Hours</th><th colspan="2">Net Prod</th></tr><tr><th>Manager Adjust</th><th>Actual</th><th>Manager Adjust</th><th>Actual</th><th>Plan</th><th>Actual</th></tr></thead><tbody id="rows"></tbody>
<tbody><tr class="total"><td class="day">Weekly Total</td><td id="planUnitsTotal"></td><td id="unitDelta" class="delta"></td><td id="planHoursTotal"></td><td id="hourDelta" class="delta"></td><td id="planProd"></td><td id="actualProd"></td></tr></tbody></table>
<div class="kpis"><div class="kpi"><h3>CIR</h3><div class="value"><input id="cir"></div><h3>Write Offs WTD</h3><div class="value"><input id="writeoffs"></div></div><div class="spacer"></div><div class="kpi"><h3>Prod MTD</h3><div class="value"><input id="mtd"></div><h3>Prod YTD</h3><div class="value"><input id="ytd"></div></div><div class="spacer"></div><div class="kpi"><h3>Target Prod</h3><div class="value"><input id="target"></div><h3>Hours to Save</h3><div class="value"><span id="hoursSave"></span></div></div></div>
</section></div><div class="note">Publish creates a PNG of the KPI sheet and opens the iPhone share sheet where supported.</div></div>
<div id="fastpad"><div class="padnav"><button class="nav" data-action="prev">‹ Previous</button><button class="nav" data-action="next">Next ›</button><button class="nav done" data-action="done">Done</button></div>
<div class="padgrid"><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-action="back">⌫</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="op" data-key="-">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="op" data-key="+">+</button></div>
<div class="padbottom"><button class="zero" data-key="0">0</button><button data-key=".">.</button><button class="op" data-key="%">%</button><button class="enter" data-action="enter">↵</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],rows=document.getElementById("rows");
days.forEach(d=>{let tr=document.createElement("tr");tr.innerHTML=`<td class="day">${d}</td><td><input class="pu"></td><td class="actual-input"><input class="au"></td><td><input class="ph"></td><td class="actual-input"><input class="ah"></td><td class="pp"></td><td class="ap"></td>`;rows.appendChild(tr)});
const num=x=>{let n=parseFloat(String(x).replace(/,/g,""));return Number.isFinite(n)?n:0},hourNum=i=>num(i?.dataset?.rawHour??i?.value??""),fmt=(n,d=0)=>n.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
function recalc(){let PU=0,PH=0,liveU=0,liveH=0,enteredU=0,enteredH=0;[...rows.rows].forEach(tr=>{let ar=tr.querySelector(".au").value.trim(),hr=tr.querySelector(".ah").value.trim(),pu=num(tr.querySelector(".pu").value),au=num(ar),ph=hourNum(tr.querySelector(".ph")),ah=hourNum(tr.querySelector(".ah"));PU+=pu;PH+=ph;liveU+=ar!==""?au:pu;liveH+=hr!==""?ah:ph;if(ar!=="")enteredU++;if(hr!=="")enteredH++;let pp=ph?pu/ph:null,ap=(ar!==""&&hr!==""&&ah)?au/ah:null;tr.querySelector(".pp").textContent=pp!==null?fmt(pp,1):"";tr.querySelector(".ap").textContent=ap!==null?fmt(ap,1):""});
planUnitsTotal.textContent=PU?fmt(PU):"";planHoursTotal.textContent=PH?fmt(PH,2):"";let ud=liveU-PU,hd=liveH-PH;unitDelta.textContent=enteredU?(ud>=0?"+":"")+fmt(ud):"";unitDelta.className="delta "+(enteredU?(ud>=0?"good":"bad"):"");hourDelta.textContent=enteredH?(hd>=0?"+":"")+fmt(hd,2):"";hourDelta.className="delta "+(enteredH?(hd<=0?"good":"bad"):"");let wp=PU&&PH?PU/PH:null,wa=(enteredU||enteredH)&&liveH?liveU/liveH:null;planProd.textContent=wp!==null?fmt(wp,1):"";actualProd.textContent=wa!==null?fmt(wa,1):"";actualProd.style.color=wa===null||wp===null?"":wa>wp?"var(--green)":wa<wp?"var(--red)":"";let t=num(target.value),hs=t&&PU&&PH?PH-PU/t:null;hoursSave.textContent=hs===null?"":(hs>0?"+":"")+fmt(hs,1);hoursSave.style.color=hs===null?"":hs<=0?"var(--green)":"var(--red)";localStorage.setItem("kpi1022",JSON.stringify(allInputs().map(x=>[x.id||x.className,x.value,x.dataset.rawHour||""])))}
const allInputs=()=>[...document.querySelectorAll("input")];let undoStack=[],redoStack=[],historyBusy=false,lastSnapshot="";
const snapshot=()=>JSON.stringify(allInputs().map(x=>({value:x.value,raw:x.dataset.rawHour||""})));
function updateHistoryButtons(){undo.disabled=!undoStack.length;undo.classList.toggle("compact",!!redoStack.length);redo.hidden=!redoStack.length;redo.disabled=!redoStack.length}
function applySnapshot(s){historyBusy=true;let vals=JSON.parse(s);vals.forEach((v,i)=>{let x=allInputs()[i];if(!x)return;x.value=v.value;if(v.raw)x.dataset.rawHour=v.raw;else delete x.dataset.rawHour});historyBusy=false;recalc();lastSnapshot=s;updateHistoryButtons()}
function recordHistory(){if(historyBusy)return;let now=snapshot();if(lastSnapshot&&now!==lastSnapshot){undoStack.push(lastSnapshot);if(undoStack.length>100)undoStack.shift();redoStack=[]}lastSnapshot=now;updateHistoryButtons()}
document.addEventListener("input",()=>{recordHistory();recalc()});undo.onclick=()=>{if(!undoStack.length)return;let c=snapshot(),p=undoStack.pop();redoStack.push(c);applySnapshot(p)};redo.onclick=()=>{if(!redoStack.length)return;let c=snapshot(),n=redoStack.pop();undoStack.push(c);applySnapshot(n)};
function restore(){try{let a=JSON.parse(localStorage.getItem("kpi1022"));if(!a)return;let ins=allInputs();if(a.length===ins.length)a.forEach((v,i)=>{ins[i].value=v[1];if(v[2])ins[i].dataset.rawHour=v[2]})}catch(e){}}
reset.onclick=()=>{if(!confirm("Reset the entire KPI form?"))return;if(activeInput)activeInput.classList.remove("pad-active");activeInput=null;fastpad.classList.remove("show");document.body.classList.remove("pad-open");allInputs().forEach(x=>{x.value="";delete x.dataset.rawHour});undoStack=[];redoStack=[];lastSnapshot="";localStorage.removeItem("kpi1022");recalc();lastSnapshot=snapshot();updateHistoryButtons()};
function validStore(){let n=store.value.trim(),ok=/^\d{3,4}$/.test(n);store.classList.toggle("invalid",n!==""&&!ok);return ok}
store.addEventListener("input",()=>{document.title=store.value.trim()||"Store";validStore()});
publish.onclick=async()=>{let storeNo=store.value.trim();if(!validStore()){store.classList.add("invalid");alert(storeNo?"Store number must be 3 or 4 digits.":"Enter a store number before publishing.");selectInput(store);return}let b=publish;b.disabled=true;b.textContent="Creating…";try{let canvas=await html2canvas(capture,{scale:2,backgroundColor:"#fff",useCORS:true}),blob=await new Promise(r=>canvas.toBlob(r,"image/png")),file=new File([blob],`${storeNo}.png`,{type:"image/png"});document.title=storeNo;if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:storeNo,text:storeNo});else{let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}catch(e){if(e.name!=="AbortError")alert("Could not create the KPI image. Please try again.")}finally{b.disabled=false;b.textContent="Publish"}};
const fastpad=document.getElementById("fastpad");let activeInput=null;const editableInputs=()=>allInputs();function isHours(i){return i&&(i.classList.contains("ph")||i.classList.contains("ah"))}
function finishHour(i){if(!isHours(i))return;let raw=i.value.trim();if(raw===""){delete i.dataset.rawHour;return}let n=parseFloat(raw);if(Number.isFinite(n)){i.dataset.rawHour=String(n);i.value=String(Math.round(n));i.dispatchEvent(new Event("input",{bubbles:true}))}}
function selectInput(i){if(!i)return;if(activeInput&&activeInput!==i){finishHour(activeInput);activeInput.classList.remove("pad-active")}activeInput=i;if(isHours(i)&&i.dataset.rawHour)i.value=i.dataset.rawHour;i.classList.add("pad-active");fastpad.classList.add("show");document.body.classList.add("pad-open")}
function closePad(){if(activeInput){finishHour(activeInput);activeInput.classList.remove("pad-active")}activeInput=null;fastpad.classList.remove("show");document.body.classList.remove("pad-open")}
editableInputs().forEach(i=>{i.readOnly=true;i.addEventListener("pointerdown",e=>{e.preventDefault();selectInput(i)})});function fire(){activeInput?.dispatchEvent(new Event("input",{bubbles:true}))}
function insertKey(k){if(!activeInput)return;let v=activeInput.value;if(k==="-")activeInput.value=v.startsWith("-")?v.slice(1):"-"+v.replace(/^\+/,"");else if(k==="+")activeInput.value=v.startsWith("+")?v.slice(1):"+"+v.replace(/^-/,"");else if(k==="%"){if(!v.endsWith("%"))activeInput.value=v+"%"}else if(k==="."){if(!v.replace(/[+\-%]/g,"").includes("."))activeInput.value=v+(v===""?"0.":".")}else activeInput.value=v+k;fire()}
function move(d){if(!activeInput)return;finishHour(activeInput);let a=editableInputs(),i=a.indexOf(activeInput);selectInput(a[Math.max(0,Math.min(a.length-1,i+d))])}
fastpad.addEventListener("pointerdown",e=>{let b=e.target.closest("button");if(!b)return;e.preventDefault();if(b.dataset.key!==undefined)insertKey(b.dataset.key);else if(b.dataset.action==="back"&&activeInput){activeInput.value=activeInput.value.slice(0,-1);fire()}else if(b.dataset.action==="prev")move(-1);else if(b.dataset.action==="next")move(1);else if(b.dataset.action==="enter"){if(activeInput){finishHour(activeInput);let order=[...document.querySelectorAll(".pu"),...document.querySelectorAll(".ph"),...document.querySelectorAll(".au"),...document.querySelectorAll(".ah"),cir,writeoffs,mtd,ytd,target],i=order.indexOf(activeInput);i>=0&&i<order.length-1?selectInput(order[i+1]):closePad()}}else if(b.dataset.action==="done")closePad()});
// One-time release migration: clear figures saved by older KPI builds on this device.
const DATA_RELEASE = "2026-09-29-clean-start-v1";
if(localStorage.getItem("kpiDataRelease") !== DATA_RELEASE){
  localStorage.removeItem("kpi1022");
  localStorage.setItem("kpiDataRelease", DATA_RELEASE);
}
restore();recalc();lastSnapshot=snapshot();updateHistoryButtons();validStore();
</script></body></html>
